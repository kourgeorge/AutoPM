version: 7
risk:
  maxPositions: 10
  positionSizePct: 0.1
  stopLossAtrMult: 2
  maxDailyLossPct: 0.03
  # Gross exposure ceiling across the whole book, as a fraction of equity. 1 = 100%, fully
  # deployed on no margin — the level `maxPositions x positionSizePct` already implies at these
  # defaults. Enforced by `exposureVeto` in orderManager.ts: ten correctly-sized positions can
  # still add up past this with nothing else checking the book as a whole.
  maxGrossExposurePct: 1
  # Minimum days until the next earnings print required to open a new position. Enforced by
  # `earningsVeto` in orderManager.ts — a gap at the open jumps past any resting stop, so this
  # is the one entry risk `stopLossAtrMult` cannot bound.
  earningsBlackoutDays: 5
  # Percentage points of equity a single name can reach before concentration_breach warns.
  # Percentage points like the new triggers.portfolioDrawdownPct, not a fraction like this
  # block's older *Pct keys (see roadmap.md §5.1).
  maxSingleWeightPct: 15
  # Same units and same caveat, for a whole sector.
  maxSectorWeightPct: 35
strategy:
  watchlist:
    - AAPL
    - MSFT
    - NVDA
    - META
    - GOOGL
    - AMZN
    - TSLA
    - AMD
    - CRM
    - ADBE
    - NFLX
    - UBER
    - SHOP
    - SQ
    - COIN
    - SPCX
    - ORCL
    - MBIS
  emaFast: 9
  emaSlow: 21
  rsiPeriod: 14
  rsiEntryMin: 50
  rsiExitMax: 40
  atrPeriod: 14
  minBars: 50
  # The entry gate, and the only place this number is written down. It is the mean of the five
  # trend signals (-1..+1), and `execute_entry` is REFUSED below it — see `low_composite` in
  # orderManager.ts. POLICY.md renders this value into the prompt rather than restating it, and
  # the entry_signal detector arms on it, so prose, attention and permission cannot drift apart.
  # A vote count is not usable here: three signals barely past the dead band and three screaming
  # ones both read as "3/5 bullish", and only the mean can tell them apart.
  compositeMin: 0.2
regime:
  # `compositeMin` is what makes "tighten entry criteria in a late cycle" an enforced rule rather
  # than a sentence in the prompt. It can only be raised here: the guard takes the regime value
  # when one is cached and strategy.compositeMin otherwise.
  expansion:
    sizeMult: 1
    rsiEntryMin: 50
    compositeMin: 0.2
  recovery:
    sizeMult: 1
    rsiEntryMin: 50
    compositeMin: 0.2
  late_cycle:
    sizeMult: 0.75
    rsiEntryMin: 55
    compositeMin: 0.25
  recession:
    sizeMult: 0.5
    rsiEntryMin: 60
    compositeMin: 0.3
triggers:
  tickIntervalMs: 60000
  positionDropPct: 2
  trailingDrawdownPct: 2
  positionSurgePct: 4
  hysteresisPct: 0.5
  # Consecutive breached readings required before a price-derived level fires. 1 fires on a
  # single quote, and a single quote can be wrong in a way that looks exactly like the event
  # (a book with one side emptied reports the missing side as 0, so the mid is half the real
  # price — below any stop, and stamped fresh). Costs one tick of latency.
  confirmTicks: 2
  defaultCooldownMs: 900000
  criticalCooldownMs: 300000
  heartbeatWithPositionsMs: 900000
  heartbeatFlatMs: 3600000
  maxQuoteAgeMs: 180000
  # Percentage points of drawdown from the equity peak before portfolio_drawdown fires —
  # a slower, book-wide bleed the per-position detectors below can't see.
  portfolioDrawdownPct: 6
approval:
  # Operator approval gate — the trader asks before an order reaches the venue.
  #
  # Scope: covers order ENTRY and EXIT only (see require: below). Stop-arming
  # (sweepStops/armStop, every tick) and stop-tightening (moveStopTo, via
  # annotate_position) are NOT gated and never ask — by design, since both are
  # strictly protective (moveStopTo can only tighten, never loosen a stop) and
  # gating them would delay protection while a request waits on you.
  #
  # mode:  off       never ask
  #        live_only ask only on a live account (paper stays fully autonomous)
  #        always    ask on both, useful while building trust in the agent
  #
  # The venue is DERIVED from the endpoint (Alpaca hostname / IBKR port), not configured
  # here — see resolveVenue in src/core/config.ts. Answer a prompt by typing y or n in the
  # terminal UI; the match is exact and deterministic, so the concierge never sees it and
  # cannot answer on your behalf.
  mode: live_only
  # How long a request waits for you. Refused as approval_timeout when it lapses.
  timeoutMs: 600000
  # deny | allow. WARNING on `deny` with `require.exit: true`: an unattended live agent
  # then cannot close a losing position — a stop-breach exit is refused at the gate and
  # journalled as a veto. If you are not watching the terminal, set `exit: false` (entries
  # gated, exits free) or `onTimeout: allow` (gate becomes delay-and-notify).
  onTimeout: deny
  require:
    entry: true
    exit: true
immutable:
  maxPositionsCeiling: 10
  maxDailyLossPctCeiling: 0.05
  positionSizePctCeiling: 0.1
  stopLossAtrMultCeiling: 4
  minTickIntervalMs: 30000
  maxGrossExposurePctCeiling: 1.5
