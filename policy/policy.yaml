# ─────────────────────────────────────────────────────────────────────────────
# L0 — the policy artifact.
#
# Single source of truth for every behavioural number in the system. Read by the
# L2 detectors, interpolated into the L3 system prompt via POLICY.md, and
# enforced by the L4 guard. A number appearing here appears NOWHERE else.
#
# Secrets, endpoints, API keys and model ids do NOT live here — see
# src/core/config.ts. The split is by nature, not by consumer: this file is
# behaviour, config.ts is environment.
#
# Edits are hot-reloaded. A malformed or out-of-bounds edit is rejected and the
# previously loaded policy stays active, so a typo cannot take the daemon down.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

risk:
  maxPositions: 5
  # Fraction of equity per position. 0.05 = 5%.
  positionSizePct: 0.05
  # Stop = entry - stopLossAtrMult * ATR.
  stopLossAtrMult: 2.0
  # Target = entry + takeProfitAtrMult * ATR. With the stop above this is 3:1 R/R.
  takeProfitAtrMult: 6.0
  # Halt all entries for the rest of the day at this drawdown from start-of-day equity.
  maxDailyLossPct: 0.03

strategy:
  # Liquid, high-momentum US stocks.
  watchlist:
    - AAPL
    - MSFT
    - NVDA
    - META
    - GOOGL
    - AMZN
    - TSLA
    - AMD
    - CRM
    - ADBE
    - NFLX
    - UBER
    - SHOP
    - SQ
    - COIN
  # EMA crossover parameters.
  emaFast: 9
  emaSlow: 21
  # RSI parameters.
  rsiPeriod: 14
  rsiEntryMin: 50
  rsiExitMax: 40
  # ATR period, used for stop placement.
  atrPeriod: 14
  # Minimum bars before any signal is considered valid.
  minBars: 50

# L2 detector parameters. Values mirror the behaviour of the watcher these
# detectors replace, so the cutover changes the architecture, not the thresholds.
triggers:
  tickIntervalMs: 60000
  # Drop from entry price. Was WARN_DROP_PCT.
  positionDropPct: 2.0
  # Drop from session high — the slow-bleed detector the old watcher could not do.
  trailingDrawdownPct: 2.0
  # Move in our favour worth a look. Was URGENT_DROP_PCT, repurposed.
  positionSurgePct: 4.0
  # A trigger must recross its threshold by this much to re-arm. Stops boundary flutter.
  hysteresisPct: 0.5
  defaultCooldownMs: 900000
  # Critical events re-fire faster, and escalate while unacked.
  criticalCooldownMs: 300000
  heartbeatWithPositionsMs: 900000
  heartbeatFlatMs: 3600000
  # A quote older than this is stale: it produces data_stale, never a price event.
  maxQuoteAgeMs: 90000

# Hard bounds. The proposer cannot emit changes to this block, and the loader
# REFUSES any policy whose values violate it — including one edited by hand.
# This is the floor under self-improvement: a losing system cannot loosen risk
# to chase its losses.
immutable:
  maxPositionsCeiling: 10
  maxDailyLossPctCeiling: 0.05
  positionSizePctCeiling: 0.10
  stopLossAtrMultCeiling: 4.0
  minTickIntervalMs: 30000
  requireStopOnEntry: true
